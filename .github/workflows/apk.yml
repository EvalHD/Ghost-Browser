name: APK bauen
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: unzip -q ghost-browser.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Bauen
        run: gradle assembleDebug --no-daemon
        working-directory: ghost-browser
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-apk
          path: ghost-browser/app/build/outputs/apk/debug/*.apk
